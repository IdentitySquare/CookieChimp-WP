name: Build and test plugin

on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: php tests/plugin-test.php

      - name: Build WordPress.org package
        run: |
          mkdir -p build/cookiechimp
          cp cookiechimp.php readme.txt build/cookiechimp/

      - name: Run plugin check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/cookiechimp

      - name: Verify CookieChimp is the first front-end script
        run: |
          wp-env run cli wp option update cookiechimp_account_id CiTest234
          curl --fail --silent http://localhost:8880/ --output /tmp/cookiechimp-homepage.html
          first_script=$(grep -o '<script[^>]*' /tmp/cookiechimp-homepage.html | head -n 1)
          echo "$first_script"
          [[ "$first_script" == *"https://cookiechimp.com/widget/CiTest234.js"* ]]

      - name: Create review ZIP
        working-directory: build
        run: zip -r cookiechimp.zip cookiechimp

      - name: Upload review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cookiechimp-wordpress-plugin
          path: build/cookiechimp.zip
          if-no-files-found: error
